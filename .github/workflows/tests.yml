name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (builds libpyhxt.so)
        run: pip install ".[test]"
      - name: Tests, against the installed package
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests"
          python "$GITHUB_WORKSPACE/test.py" "$(python -c 'import os, pyhxt; print(os.path.join(os.path.dirname(pyhxt.__file__), "libpyhxt.so"))')"
