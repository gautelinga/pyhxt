[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhxt"
dynamic = ["version"]
description = "HXT, gmsh's parallel tetrahedral mesher, on its own: fast, threaded meshing of a closed surface"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.8"
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
meshio = ["meshio"]
pyvista = ["pyvista"]
trimesh = ["trimesh"]
test = ["pytest", "meshio"]
cli = ["meshio"]

[project.scripts]
pyhxt = "pyhxt.__main__:main"

[project.urls]
Source = "https://github.com/gautelinga/pyhxt"

[tool.setuptools]
packages = ["pyhxt"]

[tool.setuptools.dynamic]
version = {attr = "pyhxt.__version__"}

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["gmsh-4.13.1"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "C4", "UP", "SIM", "RUF"]
